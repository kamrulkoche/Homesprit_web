# Docker Compose for the Homesprit backend.
#
# Unlike hgs-backend's compose file, this one runs Postgres: HGS connects to a
# hosted database it shares with a website, whereas Homesprit owns its own.
#
# Docker is not installed on the original development machine; this file is
# for deployment and for anyone who has it.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: homesprit
      POSTGRES_PASSWORD: homesprit
      POSTGRES_DB: homesprit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesprit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://homesprit:homesprit@db:5432/homesprit
    # Migrate, then serve — the release step and the start step, in order.
    command: sh -c "alembic upgrade head && uvicorn src.api.app:app --host 0.0.0.0 --port 8001"

volumes:
  pgdata:
